name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app.zip
        run: |
          if [ ! -f app.zip ]; then echo "::warning::Upload app.zip first"; exit 0; fi
          unzip -o -q app.zip
          echo "READY=1" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        if: env.READY == '1'
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        if: env.READY == '1'
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        if: env.READY == '1'
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: bash ci/build.sh
      - uses: softprops/action-gh-release@v2
        if: env.READY == '1'
        with:
          tag_name: v1.${{ github.run_number }}
          name: Subtitle Reader 1.${{ github.run_number }}
          files: |
            dist/SubtitleReader.apk
            dist/SubtitleReader-2.apk
          make_latest: true
