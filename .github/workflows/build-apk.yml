name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app.zip
        run: |
          if [ ! -f app.zip ]; then echo "::warning::Upload app.zip first"; exit 0; fi
          unzip -o -q app.zip
          echo "READY=1" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        if: env.READY == '1'
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        if: env.READY == '1'
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        if: env.READY == '1'
        run: |
          npm ci --no-audit --no-fund
          npx cap add android
          cp -r android-res/* android/app/src/main/res/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
          mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SubtitleReader.apk
      - uses: softprops/action-gh-release@v2
        if: env.READY == '1'
        with:
          tag_name: v1.${{ github.run_number }}
          name: Subtitle Reader 1.${{ github.run_number }}
          files: SubtitleReader.apk
          make_latest: true
